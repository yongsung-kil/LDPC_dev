<svg xmlns="http://www.w3.org/2000/svg" class="ldpc-fig" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="클리핑을 강하게 할수록 상한 여유 환경의 FER은 1.0에서 0으로 내려가고, 비율 복원 환경의 FER은 0에서 1.0으로 올라간다.">
<style>
.ldpc-fig { font-family: "Segoe UI", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif; }
.ldpc-fig .surface { fill: var(--bg, #ffffff); }
.ldpc-fig text { fill: var(--text, #24292f); font-size: 13px; }
.ldpc-fig text.muted { fill: var(--muted, #57606a); }
.ldpc-fig text.small { font-size: 12px; }
.ldpc-fig text.strong { font-weight: 600; }
.ldpc-fig text.head { font-size: 14px; font-weight: 600; }
.ldpc-fig .grid { stroke: var(--border, #d0d7de); stroke-width: 1; fill: none; }
.ldpc-fig .reference { stroke: var(--text, #24292f); stroke-width: 1; fill: none; opacity: 0.6; }
.ldpc-fig .mark-neutral { fill: var(--muted, #57606a); }
.ldpc-fig .mark-faint { fill: var(--muted, #57606a); opacity: 0.4; }
.ldpc-fig .mark-strong { fill: var(--text, #24292f); opacity: 0.82; }
.ldpc-fig .mark-better { fill: var(--mark-better, #d1242f); }
.ldpc-fig .mark-worse { fill: var(--mark-worse, #0550ae); }
.ldpc-fig .mark-change { fill: var(--warn, #bc4c00); }
.ldpc-fig .line-neutral, .ldpc-fig .line-better, .ldpc-fig .line-worse, .ldpc-fig .line-change {
    fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
}
.ldpc-fig .line-neutral { stroke: var(--muted, #57606a); }
.ldpc-fig .line-better { stroke: var(--mark-better, #d1242f); }
.ldpc-fig .line-worse { stroke: var(--mark-worse, #0550ae); }
.ldpc-fig .line-change { stroke: var(--warn, #bc4c00); }
.ldpc-fig .ring { stroke: var(--bg, #ffffff); stroke-width: 2; }
.ldpc-fig .cut { fill: none; stroke: var(--muted, #57606a); stroke-width: 1; stroke-dasharray: 3 3; }
.ldpc-fig .box { fill: var(--surface, #f6f8fa); stroke: var(--border, #d0d7de); stroke-width: 1; }
.ldpc-fig .box-change { fill: var(--surface, #f6f8fa); stroke: var(--warn, #bc4c00); stroke-width: 2; }
.ldpc-fig .arrow { stroke: var(--muted, #57606a); stroke-width: 1.5; fill: none; }
.ldpc-fig .arrow-head { fill: var(--muted, #57606a); }
.ldpc-fig .hit { fill: transparent; }
</style>
<rect x="0" y="0" width="760" height="290" class="surface"/>
<line x1="16" y1="16" x2="34" y2="16" class="line-better"/><circle cx="25" cy="16" r="4" class="mark-better"/><text x="40" y="20" class="small">상한 여유 (ch=8) 환경</text><line x1="179.6" y1="16" x2="197.6" y2="16" class="line-worse"/><circle cx="188.6" cy="16" r="4" class="mark-worse"/><text x="203.6" y="20" class="small">비율 복원 (ch=16) 환경</text>
<text x="16" y="46" class="muted small">FER (프레임 오류율, 낮을수록 좋음)</text>
<line x1="56" y1="238" x2="570" y2="238" class="grid"/>
<text x="48" y="242" class="muted small" text-anchor="end">0</text>
<line x1="56" y1="151" x2="570" y2="151" class="grid"/>
<text x="48" y="155" class="muted small" text-anchor="end">0.5</text>
<line x1="56" y1="64" x2="570" y2="64" class="grid"/>
<text x="48" y="68" class="muted small" text-anchor="end">1.0</text>
<text x="72" y="256" class="muted small" text-anchor="middle">무클립 (15,15)</text>
<text x="313" y="256" class="muted small" text-anchor="middle">(8,11)</text>
<text x="554" y="256" class="muted small" text-anchor="middle">논문 가이드 (4,8)</text>
<text x="313" y="278" class="muted small" text-anchor="middle">클리핑 세기 (오른쪽일수록 상한 P, Q가 낮음)</text>
<polyline points="72,64 313,126.5 554,238" class="line-better"/>
<circle cx="72" cy="64" r="5" class="mark-better ring"/>
<circle cx="313" cy="126.5" r="5" class="mark-better ring"/>
<circle cx="554" cy="238" r="5" class="mark-better ring"/>
<g><title>상한 여유 (ch=8) 환경, 무클립 (15,15): 1.0</title><circle cx="72" cy="64" r="9" class="hit"/></g>
<g><title>상한 여유 (ch=8) 환경, (8,11): 0.641</title><circle cx="313" cy="126.5" r="9" class="hit"/></g>
<g><title>상한 여유 (ch=8) 환경, 논문 가이드 (4,8): 0</title><circle cx="554" cy="238" r="9" class="hit"/></g>
<text x="568" y="216" class="strong">FER 1.0 → 0</text>
<text x="568" y="233" class="muted small">클리핑할수록 개선</text>
<polyline points="72,238 313,194.5 554,64" class="line-worse"/>
<circle cx="72" cy="238" r="5" class="mark-worse ring"/>
<circle cx="313" cy="194.5" r="5" class="mark-worse ring"/>
<circle cx="554" cy="64" r="5" class="mark-worse ring"/>
<g><title>비율 복원 (ch=16) 환경, 무클립 (15,15): 0</title><circle cx="72" cy="238" r="9" class="hit"/></g>
<g><title>비율 복원 (ch=16) 환경, (8,11): 0.25</title><circle cx="313" cy="194.5" r="9" class="hit"/></g>
<g><title>비율 복원 (ch=16) 환경, 논문 가이드 (4,8): 1.0</title><circle cx="554" cy="64" r="9" class="hit"/></g>
<text x="568" y="68.5" class="strong">FER 0 → 1.0</text>
<text x="568" y="85.5" class="muted small">클리핑할수록 악화</text>
</svg>
